[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-engagement"
version = "0.1.0"
description = "Protocol-only engagement and public comment collection by URL"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "curl-cffi==0.9.0",
    "fastapi",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "requests",
    "uvicorn[standard]",
    "xhshow==0.2.0",
]

[project.optional-dependencies]
test = ["pytest"]
browser = ["camoufox==0.5.4", "playwright==1.60.0"]

[project.scripts]
creator-engagement = "app.manually_execute_script.fetch_url_engagement:main"
creator-engagement-login = "app.manually_execute_script.login_platform:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
